server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /orders {
        proxy_pass http://api:8080;
    }

    location /orderbook {
        proxy_pass http://api:8080;
    }

    location /trades {
        proxy_pass http://api:8080;
    }

    location /metrics {
        proxy_pass http://api:8080;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
